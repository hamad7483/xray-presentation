<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HI-SCAN 6040 CTiX — smiths detection</title>
<style>
:root{--ink:#eef2f7;--mut:#8f9aa8;--line:rgba(255,255,255,.13);--acc:#5aa7ff;--cy:#62dcff;--good:#7dffb3;--warn:#ffb08f;
  --rw:clamp(210px,20vw,280px);--gap:clamp(14px,2.6vw,48px);--pad:clamp(10px,2.2vw,40px);
  --sw:min(62vw, calc((100dvh - 2*var(--pad)) * 16 / 9), calc(100vw - var(--rw) - var(--gap) - 2*var(--pad)))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07090d;color:var(--ink);
  font-family:"SF Arabic","Geeza Pro","Noto Kufi Arabic","Noto Sans Arabic",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color-scheme:dark;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:fixed;inset:0;direction:ltr;display:grid;grid-template-columns:var(--sw) var(--rw);grid-template-rows:auto;
  grid-template-areas:"scene rail";column-gap:var(--gap);justify-content:center;align-content:center;padding:var(--pad);
  background:radial-gradient(90% 80% at 35% 45%,#18202c 0%,#0b0f15 55%,#05070a 100%)}
#scene{grid-area:scene;align-self:center;position:relative;width:var(--sw);aspect-ratio:16/9;border-radius:clamp(12px,1.4vw,22px);overflow:hidden;
  background:#07090d;border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);isolation:isolate}
#scene .brand{position:absolute;top:clamp(8px,1.2vw,18px);left:clamp(8px,1.2vw,18px);z-index:30;direction:ltr;pointer-events:none;
  padding:6px 11px 7px;border-radius:12px;background:rgba(8,11,16,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08)}
#scene .brand .n{font:500 clamp(11px,1vw,16px)/1.05 "Inter","Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;color:#f2f5f9}
#scene .brand .n b{font-weight:700}
#scene .brand .p{margin-top:3px;font:600 clamp(8px,.62vw,10.5px)/1 "Inter","Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;color:rgba(255,255,255,.66)}
#note{grid-area:note;display:none}
/* right rail */
#rail{grid-area:rail;direction:rtl;align-self:center;height:max(calc(var(--sw) * 9 / 16), min(440px, calc(100dvh - 2 * var(--pad))));min-height:0;display:flex;flex-direction:column;padding:clamp(12px,1.1vw,18px) clamp(10px,1vw,16px) clamp(10px,.9vw,14px);
  border-radius:clamp(14px,1.4vw,22px);background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.025) 45%,rgba(255,255,255,.045));
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 20px 60px rgba(0,0,0,.4);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
#rail .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:clamp(8px,1vh,14px)}
#rail .hd .k{font-size:12px;color:var(--mut)}
#rail .hd .c{direction:ltr;font:600 11px/1 "Inter",Arial,sans-serif;color:#cfd6e0;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
#steps{list-style:none;position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
#steps::-webkit-scrollbar{display:none}
#steps .track{position:absolute;right:calc(clamp(28px,1.7vw,34px)/2 - 1px);top:16px;bottom:16px;width:1.5px;background:rgba(255,255,255,.1);border-radius:2px;pointer-events:none}
#steps .track i{position:absolute;inset:0;background:linear-gradient(180deg,var(--cy),var(--acc));transform-origin:top;transform:scaleY(0);transition:transform .7s cubic-bezier(.4,0,.2,1)}
.step{display:flex;gap:10px;align-items:flex-start;padding:4px 0;position:relative}
.dot{flex:none;width:clamp(28px,1.7vw,34px);height:clamp(28px,1.7vw,34px);border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#121720;color:#9aa4b2;
  font:600 12px/1 "Inter",Arial,sans-serif;position:relative;z-index:1;transition:background .35s,border-color .35s,color .35s,box-shadow .35s}
.step.done .dot{color:#dfe7f2;border-color:rgba(98,220,255,.35)}
.step.on .dot{background:radial-gradient(circle at 50% 35%,#6aa0ff,#2a5bd8);color:#fff;border-color:rgba(255,255,255,.45);box-shadow:0 0 0 4px rgba(90,167,255,.14)}
.txt{min-width:0;flex:1;padding-top:5px}
.ttl{font-size:clamp(13px,.8vw,16px);font-weight:700;color:#b9c2ce;cursor:pointer;line-height:1.25;transition:color .3s}
.step.on .ttl{color:#fff}
.desc{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s ease,opacity .35s ease,margin .35s}
.desc>div{overflow:hidden;font-size:clamp(12px,.72vw,14px);line-height:1.65;color:#d3dae4}
.step.on .desc{grid-template-rows:1fr;opacity:1;margin-top:6px}
.dec{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dec button{flex:1 1 auto;white-space:nowrap;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:12px;font-weight:700;transition:background .2s,border-color .2s}
.dec button.ok.sel,.dec button.ok:hover{border-color:rgba(125,255,179,.6);background:rgba(60,190,120,.22);color:var(--good)}
.dec button.chk.sel,.dec button.chk:hover{border-color:rgba(255,150,120,.6);background:rgba(220,90,60,.22);color:var(--warn)}
.verdict{margin-top:6px;font-size:11.5px;min-height:1em}
.nav{display:flex;align-items:center;justify-content:center;gap:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);margin-top:6px}
.nav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.06);transition:background .2s}
.nav button:hover:not(:disabled){background:rgba(255,255,255,.14)}
.nav button:disabled{opacity:.3;cursor:default}
.nav #play{width:40px;height:40px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07))}
.nav svg{width:16px;height:16px;fill:#fff}
#play .i-play{display:none}#play.paused .i-play{display:block}#play.paused .i-pause{display:none}
.hint{margin-top:7px;font-size:10.5px;color:#6f7a87;text-align:center}
/* phones in portrait: scene left, slim dot rail right, explanation under the scene */
@media (max-width:640px) and (orientation:portrait){
  :root{--rw:50px;--gap:8px;--pad:10px;--sw:calc(100vw - var(--rw) - var(--gap) - 2*var(--pad))}
  #app{align-content:center;row-gap:10px;grid-template-rows:auto auto;grid-template-areas:"scene rail" "note rail"}
  #note{display:block;direction:rtl;height:158px;overflow-y:auto;padding:12px 14px;border-radius:14px;background:linear-gradient(165deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line)}
  #note .t{font-size:15px;font-weight:700}
  #note .d{font-size:13px;line-height:1.7;color:#d3dae4;margin-top:4px}
  #note .dec{margin-top:10px}#note .dec button{padding:10px 6px;font-size:13px}
  #scene .brand{padding:4px 7px 5px;border-radius:8px}#scene .brand .n{font-size:10px}#scene .brand .p{font-size:6.5px;margin-top:2px}
  #rail{padding:8px 0;align-items:center;border-radius:25px;height:auto;align-self:stretch}
  #rail .hd,.hint,.txt{display:none}
  #steps{align-items:center;gap:8px;flex:0 0 auto;overflow:visible}
  #steps .track{right:auto;left:50%;margin-left:-.75px;top:10px;bottom:10px}
  .step{padding:0}
  .nav{flex-direction:column;gap:8px;border-top:0;padding-top:12px;margin-top:auto}
  .nav button{width:32px;height:32px}.nav #play{width:34px;height:34px}
}
@media (max-height:460px){ .hint,#rail .hd{display:none} .step{padding:2px 0} .dot{width:26px;height:26px} .desc>div{font-size:11.5px;line-height:1.5} }

#scene .L{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .55s ease;pointer-events:none;background:#07090d}
#scene .L.on{opacity:1}
#scene .ken{animation:ken 16s ease-in-out infinite alternate}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.05) translate(-1%,.6%)}}
#scene .grade{position:absolute;inset:0;z-index:20;pointer-events:none;background:radial-gradient(130% 100% at 50% 50%,transparent 62%,rgba(0,0,0,.28) 100%)}
#scene.white .grade{opacity:0}
#scene .grade{transition:opacity .8s}
</style>
</head>
<body>
<div id="app">
  <section id="scene">
    <img id="L_machine" class="L ken" alt="">
    <video id="L_entry" class="L" muted playsinline preload="auto"></video>
    <video id="L_scan" class="L" muted playsinline preload="auto"></video>
    <video id="L_image" class="L" muted playsinline preload="auto"></video>
    <img id="L_xray" class="L" alt="">
    <div class="grade"></div>
    <div class="brand"><div class="n"><b>smiths</b> detection</div><div class="p">HI-SCAN 6040 CTiX</div></div>
  </section>
  <div id="note"></div>
  <aside id="rail">
  <div class="hd"><span class="k">مراحل العرض</span><span class="c" id="counter">1 / 5</span></div>
  <ol id="steps"><div class="track"><i id="bar"></i></div></ol>
  <div class="nav">
    <button id="prev" aria-label="السابق"><svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
    <button id="play" aria-label="تشغيل / إيقاف"><svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg><svg class="i-play" viewBox="0 0 24 24"><path d="M17 5v14L6 12z"/></svg></button>
    <button id="next" aria-label="التالي"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
    <button id="fs" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
  </div>
  <div class="hint">← التالي · → السابق · مسافة للإيقاف</div>
</aside>

</div>
<script>
function makeRail(o){
  const S=o.steps, list=document.getElementById('steps'), note=document.getElementById('note');
  const decHTML='<div class="dec"><button class="ok" data-k="clear">سليمة</button><button class="chk" data-k="check">تفتيش إضافي</button></div><div class="verdict"></div>';
  S.forEach((s,i)=>{const li=document.createElement('li');li.className='step';
    li.innerHTML=`<button class="dot" aria-label="${s.t}">${i+1}</button><div class="txt"><div class="ttl">${s.t}</div><div class="desc"><div>${s.d}${s.decide?decHTML:''}</div></div></div>`;
    li.querySelector('.dot').onclick=()=>go(i); li.querySelector('.ttl').onclick=()=>go(i); list.appendChild(li);});
  let cur=-1, paused=false;
  function wireDec(root){root.querySelectorAll('.dec button').forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    document.querySelectorAll('.dec button').forEach(x=>x.classList.toggle('sel',x.dataset.k===b.dataset.k));
    const v=b.dataset.k==='clear'?'سليمة · تكمل الحقيبة طريقها':'تفتيش إضافي · تحويل للفحص اليدوي';
    document.querySelectorAll('.verdict').forEach(x=>{x.textContent=v;x.style.color=b.dataset.k==='clear'?'var(--good)':'var(--warn)'});
    o.onDecide&&o.onDecide(b.dataset.k);});}
  wireDec(list);
  function go(i){i=Math.max(0,Math.min(S.length-1,i)); if(i===cur) return; cur=i;
    document.querySelectorAll('.step').forEach((el,k)=>{el.classList.toggle('on',k===i);el.classList.toggle('done',k<i)});
    document.getElementById('counter').textContent=`${i+1} / ${S.length}`;
    document.getElementById('bar').style.transform=`scaleY(${i/(S.length-1)})`;
    document.getElementById('prev').disabled=i===0; document.getElementById('next').disabled=i===S.length-1;
    if(note){note.innerHTML=`<div class="t">${i+1}. ${S[i].t}</div><div class="d">${S[i].d}</div>${S[i].decide?decHTML:''}`;wireDec(note);}
    document.querySelectorAll('.verdict').forEach(x=>x.textContent='');document.querySelectorAll('.dec button').forEach(x=>x.classList.remove('sel'));
    setPaused(false,true); o.onGo(i);}
  function setPaused(p,silent){paused=p;document.getElementById('play').classList.toggle('paused',p);if(!silent&&o.onPause)o.onPause(p);}
  document.getElementById('next').onclick=()=>go(cur+1);
  document.getElementById('prev').onclick=()=>go(cur-1);
  document.getElementById('play').onclick=()=>setPaused(!paused);
  const fs=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})};
  document.getElementById('fs').onclick=fs;
  addEventListener('keydown',e=>{ if(e.repeat)return;
    if(['ArrowLeft','ArrowDown','PageDown','Enter'].includes(e.key)){e.preventDefault();go(cur+1)}
    else if(['ArrowRight','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1)}
    else if(e.key===' '){e.preventDefault();setPaused(!paused)}
    else if(e.key==='f'||e.key==='F'){fs()}});
  return {go,setPaused,get cur(){return cur}};
}

(function(){
  const STEPS=[
    {t:'الجهاز',d:'هذا جهاز HI-SCAN 6040 CTiX من الأمام: الهيكل، النفق، والسير.'},
    {t:'دخول الحقيبة',d:'توضع الحقيبة على السير وتدخل النفق بسرعة ثابتة.'},
    {t:'المسح بالأشعة',d:'أنبوب الأشعة يدور حول الحقيبة ويلتقط مقاطع من كل الزوايا.'},
    {t:'صورة الأشعة',d:'تظهر الصورة على شاشة المفتش بخلفية بيضاء: البرتقالي عضوي، الأخضر مختلط، الأزرق معادن.'},
    {t:'القرار',d:'يقرر المفتش: الحقيبة سليمة، أو تحتاج تفتيشاً إضافياً.',decide:true}
  ];
  const LAYER=['machine','entry','scan','image','xray'].map(k=>document.getElementById('L_'+k));
  const scene=document.getElementById('scene');
  // set sources from JS so the media shim maps them to preloaded blobs
  const set=(el,k,v)=>{el[k]=v};
  set(LAYER[0],'src','media/machine.jpg'); set(LAYER[4],'src','media/xray.jpg');
  [['entry',1],['scan',2],['image',3]].forEach(([k,i])=>{const v=LAYER[i]; set(v,'poster','media/'+k+'_p.jpg'); set(v,'src','media/'+k+'.mp4'); v.load();});
  let top=null, z=1, tok=0, hideT=0, active=null;
  function show(el){ if(top===el) return; z+=1; el.style.zIndex=z; void el.offsetWidth; el.classList.add('on'); const prev=top; top=el;
    clearTimeout(hideT); hideT=setTimeout(()=>{LAYER.forEach(l=>{ if(l!==top){ l.classList.remove('on'); if(l.tagName==='VIDEO'){ try{l.pause()}catch(e){} } } })},700); }
  function ready(v){ return new Promise(res=>{ if(v.readyState>=2 && Math.abs(v.currentTime)<0.01) return res();
      const done=()=>{v.removeEventListener('seeked',done);v.removeEventListener('loadeddata',done);res()};
      v.addEventListener('seeked',done); v.addEventListener('loadeddata',done);
      try{ v.currentTime=0 }catch(e){}; setTimeout(res,900); }); }
  function onGo(i){ const my=++tok; const el=LAYER[i]; active=el;
    scene.classList.toggle('white', i>=4);
    if(el.tagName==='VIDEO'){ try{el.pause()}catch(e){}
      ready(el).then(()=>{ if(my!==tok) return; const p=el.play(); show(el); if(p&&p.catch)p.catch(()=>rail.setPaused(true,true)); });
      el.ontimeupdate=()=>{ if(i===3 && el.currentTime>0.9 && active===el) scene.classList.add('white'); };
      el.onended=()=>{ rail.setPaused(true,true); };
    } else { show(el); }
  }
  function onPause(p){ const v=active; if(!v||v.tagName!=='VIDEO') return; if(p) v.pause(); else { if(v.ended) v.currentTime=0; v.play().catch(()=>{}); } }
  const rail=makeRail({steps:STEPS,onGo,onPause});
  const start=()=>rail.go(0);
  if(LAYER[0].complete) start(); else { LAYER[0].onload=start; setTimeout(start,1500); }
})();
</script>
</body>
</html>
