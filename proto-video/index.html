<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="p1.js"></script><script src="p2.js"></script><script src="p3.js"></script><script>(function(){var M={};(window.__Q||[]).forEach(function(e){if(!M[e[0]])M[e[0]]=[e[1],""];M[e[0]][1]+=e[2]});window.__Q=null;var C={};function u(v){if(typeof v!=="string"||v.indexOf("blob:")===0||v.indexOf("data:")===0)return v;var k=v.split("/").pop().split("?")[0];var e=M[k];if(!e)return v;if(!C[k]){var b=atob(e[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);C[k]=URL.createObjectURL(new Blob([a],{type:e[0]}));M[k]=[e[0],""]}return C[k]}function hook(p,n){var d=Object.getOwnPropertyDescriptor(p,n);if(d&&d.set)Object.defineProperty(p,n,{get:d.get,set:function(v){d.set.call(this,u(v))},configurable:true,enumerable:d.enumerable})}hook(HTMLMediaElement.prototype,"src");hook(HTMLSourceElement.prototype,"src");hook(HTMLImageElement.prototype,"src");hook(HTMLVideoElement.prototype,"poster");var sa=Element.prototype.setAttribute;Element.prototype.setAttribute=function(a,v){if(a==="src"||a==="poster"||a==="href")v=u(v);return sa.call(this,a,v)};})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HI-SCAN 6040 CTiX — smiths detection</title>
<style>
  :root{
    --ink:#f4f7fb;
    --soft:rgba(230,236,244,.72);
    --muted:rgba(200,210,222,.55);
    --line:rgba(230,242,255,.22);
    --accent:#7fd4ff;
    --good:#7dffb3;
    --warn:#ffc56b;
    --rail:320px;
    --ease:cubic-bezier(.2,.78,.2,1);
    --glass:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05) 42%,rgba(255,255,255,.08));
    --bg1:#0a1018;
    --bg2:#151d28;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070b10;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI","Helvetica Neue",Tahoma,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;color-scheme:dark}
  button{font:inherit;color:inherit;appearance:none;border:0;background:none;cursor:pointer;padding:0}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  button:disabled{opacity:.28;cursor:default}
  #app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) var(--rail);direction:ltr;background:
    radial-gradient(ellipse at 38% 46%, #1a2433 0%, var(--bg1) 62%, #06090d 100%)}
  #scene{
    position:relative;overflow:hidden;margin:18px 0 18px 18px;border-radius:28px;
    background:#070b10;border:1px solid rgba(230,242,255,.12);
    box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }
  #stage{position:absolute;inset:0;overflow:hidden;border-radius:inherit;background:#070b10}
  #stage .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s var(--ease);pointer-events:none}
  #stage .layer.on{opacity:1}
  #stage img.ken{animation:ken 14s var(--ease) alternate infinite}
  @keyframes ken{from{transform:scale(1.0) translate3d(0,0,0)}to{transform:scale(1.07) translate3d(-1.2%,1%,0)}}
  #grade{position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:inherit;
    background:linear-gradient(180deg,rgba(6,10,16,.35) 0%,transparent 22%,transparent 62%,rgba(6,10,16,.4) 100%)}
  #brand{position:absolute;top:22px;left:26px;z-index:6;direction:ltr;text-align:left;pointer-events:none;
    text-shadow:0 2px 18px rgba(0,0,0,.55)}
  #brand .name{font:600 22px/1.05 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.03em}
  #brand .name span{font-weight:350}
  #brand .product{margin-top:6px;font:500 12px/1.1 -apple-system,BlinkMacSystemFont,Arial,sans-serif;letter-spacing:.12em;color:rgba(255,255,255,.72);text-transform:uppercase}
  #scene.light{background:#f7f7f7}
  #scene.light #grade{background:linear-gradient(180deg,rgba(255,255,255,.0),rgba(255,255,255,0) 80%)}
  #scene.light #brand .name,#scene.light #brand .product{color:#1a1f26;text-shadow:none}

  #rail{position:relative;display:flex;flex-direction:column;padding:22px 22px 18px;z-index:8;min-width:0;direction:rtl}
  .glass-col{
    flex:1;display:flex;flex-direction:column;padding:22px 18px 16px;border-radius:28px;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
    border:1px solid var(--line);
    box-shadow:0 18px 50px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.16);
    backdrop-filter:blur(28px) saturate(1.35);-webkit-backdrop-filter:blur(28px) saturate(1.35);
  }
  .steps{position:relative;display:flex;flex-direction:column;gap:0;flex:1;padding:4px 4px 8px 8px}
  .steps:before{content:"";position:absolute;top:28px;bottom:28px;right:32px;width:1px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.28) 12%,rgba(255,255,255,.28) 88%,transparent)}
  .step{position:relative;display:grid;grid-template-columns:1fr 44px;gap:12px;align-items:start;min-height:72px;padding:4px 0 10px}
  .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1;
    border:1px solid rgba(255,255,255,.28);background:rgba(8,12,18,.55);color:var(--soft);
    font:600 15px/1 -apple-system,BlinkMacSystemFont,Arial,sans-serif;letter-spacing:0;transition:.35s var(--ease)}
  .step.active .dot{border-color:rgba(127,212,255,.85);color:#fff;background:rgba(90,170,220,.22);
    box-shadow:0 0 0 6px rgba(127,212,255,.10), 0 0 24px rgba(80,180,255,.35)}
  .step.done .dot{border-color:rgba(127,255,179,.45);color:#d9ffe9}
  .step .meta{text-align:right;padding-top:8px}
  .step .label{font:600 15px/1.2 inherit;color:rgba(255,255,255,.55);transition:color .3s}
  .step.active .label{color:#fff}
  .explain{margin-top:8px;font:400 13px/1.55 inherit;color:var(--soft);max-height:0;overflow:hidden;opacity:0;transition:.4s var(--ease)}
  .step.active .explain{max-height:140px;opacity:1}

  .decision{display:none;gap:8px;margin:8px 0 4px}
  .step.active .decision.show{display:flex}
  .decision button{flex:1;padding:10px 8px;border-radius:16px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);font:600 13px/1.2 inherit;transition:.2s}
  .decision button:hover{background:rgba(255,255,255,.12)}
  .decision button.pick-good{border-color:rgba(125,255,179,.7);background:rgba(80,200,140,.2);color:var(--good)}
  .decision button.pick-warn{border-color:rgba(255,197,107,.7);background:rgba(200,150,60,.2);color:var(--warn)}

  .nav{display:flex;gap:8px;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)}
  .nav .pair{display:flex;gap:8px}
  .nav button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);transition:.2s}
  .nav button:hover:not(:disabled){background:rgba(255,255,255,.14)}
  .nav .next{width:auto;padding:0 18px;border-radius:22px;font:600 14px/1 inherit;letter-spacing:.02em}
  .hint{margin-top:8px;font:400 11px/1.4 inherit;color:var(--muted);text-align:center;white-space:nowrap}
  @media (max-width:820px){
    :root{--rail:100%}
    #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
    #scene{margin:10px 10px 0}
    #rail{padding:10px}
    .glass-col{padding:12px 12px 10px}
    .steps{flex-direction:row;overflow-x:auto;gap:8px;padding:0}
    .steps:before{display:none}
    .step{grid-template-columns:44px;min-height:0;padding:4px}
    .step .meta{display:none}
    .step.active .meta{display:block;position:absolute;left:12px;right:12px;top:56px;padding:0;z-index:2}
    .glass-col{position:relative;padding-bottom:120px}
    .explain{background:rgba(8,12,18,.55);padding:8px 10px;border-radius:12px}
  }
</style>
</head>
<body>
<div id="app">
  <section id="scene">
    <div id="stage">
      <img id="still" class="layer" alt="">
      <video id="vid" class="layer" playsinline muted></video>
    </div>
    <div id="grade"></div>
    <div id="brand">
      <div class="name">smiths <span>detection</span></div>
      <div class="product">HI-SCAN 6040 CTiX</div>
    </div>
  </section>
  <aside id="rail">
    <div class="glass-col">
      <div class="steps" id="steps"></div>
      <div class="nav">
        <div class="pair">
          <button type="button" id="btnPrev" aria-label="السابق">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button type="button" id="btnPlay" aria-label="تشغيل أو إيقاف">
            <svg id="icPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icPause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M7 5h3v14H7zm7 0h3v14h-3z"/></svg>
          </button>
        </div>
        <button type="button" class="next" id="btnNext">التالي</button>
      </div>
      <div class="hint">← → للتنقّل &nbsp;·&nbsp; مسافة لإيقاف الفيديو</div>
    </div>
  </aside>
</div>
<script>
(function(){
  const MEDIA = Object.assign({
    machine: "media/machine.jpg",
    entry: "media/entry.mp4",
    scan: "media/scan.mp4",
    image: "media/image.mp4",
    xray: "media/xray.jpg",
    posters: {
      entry: "media/entry.jpg",
      scan: "media/scan.jpg"
    }
  }, window.__MEDIA || {});

  const STAGES = [
    {id:"machine", title:"الجهاز", note:"تعرّفوا على أجزاء الجهاز الرئيسية، وهذا هو شكله من الأمام.", kind:"still", src:"machine", ken:true, light:false},
    {id:"entry", title:"الدخول", note:"الحقيبة تُوضع على السير وتدخل النفق، والكاميرا من الأعلى ومن الخلف.", kind:"video", src:"entry", light:false},
    {id:"scan", title:"المسح", note:"حلقة التصوير تدور حول الحقيبة، وشعاع المسح يكشف محتوياتها.", kind:"video", src:"scan", light:false},
    {id:"image", title:"الصورة", note:"تظهر صورة الأشعة الحقيقية على شاشة المفتش، بخلفية بيضاء وألوان أوضح.", kind:"video", src:"image", after:"xray", lightAfter:true, light:false},
    {id:"decide", title:"القرار", note:"قرّروا الآن: الحقيبة سليمة، أو تحتاج تفتيشاً إضافياً.", kind:"still", src:"xray", light:true, decide:true}
  ];

  const stepsEl = document.getElementById("steps");
  const still = document.getElementById("still");
  const vid = document.getElementById("vid");
  const scene = document.getElementById("scene");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnPlay = document.getElementById("btnPlay");
  const icPlay = document.getElementById("icPlay");
  const icPause = document.getElementById("icPause");

  let i = 0, decision = null;

  STAGES.forEach((s, n) => {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "step";
    el.dataset.i = n;
    el.innerHTML = `<div class="meta"><div class="label">${s.title}</div><div class="explain">${s.note}${s.decide?`<div class="decision" id="decision"><button type="button" data-pick="good">سليمة</button><button type="button" data-pick="warn">تفتيش إضافي</button></div>`:""}</div></div><div class="dot">${n+1}</div>`;
    el.addEventListener("click", () => go(n));
    stepsEl.appendChild(el);
  });

  stepsEl.addEventListener("click", (e) => {
    const b = e.target.closest("[data-pick]");
    if(!b) return;
    e.stopPropagation();
    decision = b.dataset.pick;
    stepsEl.querySelectorAll("[data-pick]").forEach(x => x.classList.remove("pick-good","pick-warn"));
    b.classList.add(decision === "good" ? "pick-good" : "pick-warn");
  });

  function mediaUrl(key){
    const v = MEDIA[key];
    if(!v) return "";
    if(typeof v === "string") return v;
    return v;
  }

  function showPlay(playing){
    icPlay.hidden = playing;
    icPause.hidden = !playing;
  }

  function stopVid(){
    try{ vid.pause(); }catch(e){}
    showPlay(false);
  }

  function go(n){
    i = Math.max(0, Math.min(STAGES.length-1, n));
    const s = STAGES[i];
    [...stepsEl.children].forEach((el, k) => {
      el.classList.toggle("active", k===i);
      el.classList.toggle("done", k<i);
    });
    const dec = document.getElementById("decision");
    if(dec) dec.classList.toggle("show", !!s.decide);
    btnPrev.disabled = i===0;
    btnNext.disabled = i===STAGES.length-1;
    btnNext.textContent = i===STAGES.length-1 ? "النهاية" : "التالي";

    stopVid();
    still.classList.remove("ken","on");
    vid.classList.remove("on");
    scene.classList.toggle("light", !!s.light);

    if(s.kind === "video"){
      const src = mediaUrl(s.src);
      const poster = (MEDIA.posters && MEDIA.posters[s.src]) || "";
      if(poster){ still.src = poster; still.classList.add("on"); }
      if(vid.dataset.src !== src){
        vid.dataset.src = src;
        vid.src = src;
      }
      vid.currentTime = 0;
      vid.classList.add("on");
      const play = vid.play();
      if(play && play.then) play.then(()=>{ still.classList.remove("on"); showPlay(true); }).catch(()=> showPlay(false));
      else showPlay(!vid.paused);
      vid.onended = () => {
        showPlay(false);
        if(s.after){
          still.src = mediaUrl(s.after);
          still.classList.add("on");
          vid.classList.remove("on");
          if(s.lightAfter) scene.classList.add("light");
        }
      };
    } else {
      vid.removeAttribute("src"); vid.dataset.src = "";
      vid.load();
      still.src = mediaUrl(s.src);
      still.classList.add("on");
      if(s.ken) still.classList.add("ken");
      showPlay(false);
    }
  }

  function toggle(){
    const s = STAGES[i];
    if(s.kind !== "video") return;
    if(vid.paused){ vid.play().then(()=>showPlay(true)).catch(()=>{}); }
    else { vid.pause(); showPlay(false); }
  }

  btnPrev.onclick = () => go(i-1);
  btnNext.onclick = () => { if(i<STAGES.length-1) go(i+1); };
  btnPlay.onclick = toggle;

  window.addEventListener("keydown", (e) => {
    if(e.repeat) return;
    if(e.code==="Space"){ e.preventDefault(); toggle(); }
    else if(e.code==="ArrowLeft" || e.code==="ArrowDown"){ e.preventDefault(); go(i+1); }
    else if(e.code==="ArrowRight" || e.code==="ArrowUp"){ e.preventDefault(); go(i-1); }
  });

  // RTL: left arrow advances (next is visually to the left in a typical Arabic deck).
  go(0);
})();
</script>
</body>
</html>
