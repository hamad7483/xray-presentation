<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HI-SCAN 6040 CTiX · 3D</title>
<style>
:root{--glass:rgba(28,32,40,.42);--line:rgba(255,255,255,.14);--txt:#eef2f7;--mut:#9aa4b2;--acc:#4f8cff;--cy:#58e1ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0d10;color:var(--txt);font-family:"SF Arabic","Geeza Pro","Noto Kufi Arabic","Noto Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage canvas:active{cursor:grabbing}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 38% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
.brand{position:fixed;top:26px;left:34px;direction:ltr;font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:19px;letter-spacing:.2px;color:#e8ecf2;font-weight:500}
.brand b{font-weight:700}
.title{position:fixed;left:34px;bottom:30px;direction:ltr;pointer-events:none}
.title h1{font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:44px;letter-spacing:-.5px;line-height:1;background:linear-gradient(180deg,#fff,#b9c3d1);-webkit-background-clip:text;background-clip:text;color:transparent}
.title p{direction:rtl;text-align:left;margin-top:8px;color:var(--mut);font-size:14px}
/* right glass stepper column */
.col{position:fixed;top:18px;right:18px;bottom:18px;width:344px;border-radius:28px;padding:26px 22px 20px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 40%,rgba(255,255,255,.05));
  backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column}
.col .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.col .hd .k{font-size:12px;color:var(--mut);letter-spacing:.3px}
.col .hd .n{direction:ltr;font-family:Inter,Arial,sans-serif;font-size:13px;color:#cfd6e0;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
#steps{list-style:none;position:relative;flex:1;display:flex;flex-direction:column;gap:6px;overflow:auto}
.rail{position:absolute;right:21px;top:22px;bottom:22px;width:2px;background:rgba(255,255,255,.1);border-radius:2px}
#bar{position:absolute;inset:0;background:linear-gradient(180deg,var(--cy),var(--acc));transform-origin:top;transition:transform .8s cubic-bezier(.6,0,.2,1);box-shadow:0 0 12px var(--acc)}
.step{display:flex;gap:14px;align-items:flex-start;position:relative;padding:6px 0}
.dot{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(20,24,30,.75);color:#aab3c0;font:600 15px Inter,Arial,sans-serif;cursor:pointer;position:relative;z-index:1;transition:all .4s}
.step.done .dot{color:#dfe7f2;border-color:rgba(88,225,255,.35)}
.step.on .dot{background:radial-gradient(circle at 50% 35%,#6ea2ff,#2556d6);color:#fff;border-color:rgba(255,255,255,.5);box-shadow:0 0 0 6px rgba(79,140,255,.16),0 0 26px rgba(79,140,255,.8);animation:pulse 2.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(79,140,255,.05),0 0 34px rgba(79,140,255,.95)}}
.txt{padding-top:4px;min-width:0}
.ttl{font-size:17px;font-weight:700;color:#c7cfda;cursor:pointer;transition:color .3s}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.step.on .ttl{color:#fff;font-size:19px}
.desc{max-height:0;overflow:hidden;opacity:0;font-size:14px;line-height:1.75;color:#d7dee8;transition:max-height .6s ease,opacity .5s ease,margin .4s}
.step.on .desc{max-height:180px;opacity:1;margin-top:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.ctl button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .2s}
.ctl button:hover{background:rgba(255,255,255,.16)}
.ctl #play{width:60px;height:60px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08))}
.ctl svg{width:20px;height:20px;fill:#fff}
#play .i-play{display:none}#play.paused .i-play{display:block}#play.paused .i-pause{display:none}
.ctl .fsb{width:38px;height:38px;opacity:.75}
.hint{font-size:11px;color:#7d8794;text-align:center;margin-top:10px}
/* operator screen */
#screen{position:fixed;left:34px;right:396px;top:84px;bottom:110px;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transform:translateY(16px) scale(.98);transition:all .8s cubic-bezier(.3,.7,.2,1)}
#screen.show{opacity:1;transform:none}
#screen .mon{pointer-events:auto;background:#fff;border-radius:18px;padding:16px 16px 12px;box-shadow:0 0 0 1px rgba(255,255,255,.25),0 40px 120px rgba(0,0,0,.65),0 0 60px rgba(79,140,255,.25);max-height:100%;display:flex;flex-direction:column;transition:all .8s cubic-bezier(.3,.7,.2,1);width:min(100%,780px)}
#screen.small{justify-content:flex-start;align-items:flex-start}
#screen.small .mon{width:min(46%,520px)}
#screen .mbar{display:flex;justify-content:space-between;align-items:center;color:#2b3340;font-size:13px;margin-bottom:10px}
#screen .mbar b{font-family:Inter,Arial,sans-serif;direction:ltr;font-weight:600}
#screen img{display:block;width:100%;height:auto;min-height:0;object-fit:contain;border-radius:8px;background:#fff;filter:brightness(1.04) saturate(1.06)}
.legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:13px;color:#33404f}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-left:6px;vertical-align:-1px}
#decision{position:fixed;right:396px;bottom:110px;display:flex;flex-direction:column;gap:12px;align-items:stretch;opacity:0;pointer-events:none;transform:translateY(14px);transition:all .7s}
#decision.show{opacity:1;pointer-events:auto;transform:none}
#decision button{font:700 20px "Noto Kufi Arabic","SF Arabic",sans-serif;color:#fff;border-radius:20px;padding:16px 34px;cursor:pointer;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#ok{background:linear-gradient(180deg,rgba(40,200,120,.55),rgba(20,120,70,.45));box-shadow:0 0 30px rgba(40,220,130,.35)}
#chk{background:linear-gradient(180deg,rgba(255,90,70,.55),rgba(170,40,30,.45));box-shadow:0 0 30px rgba(255,90,70,.35)}
#verdict{font-size:15px;text-align:center;min-height:22px;color:#fff}
#verdict.ok{color:#7dffb7}#verdict.chk{color:#ff9d8f}
@media (max-width:900px){.col{top:auto;left:10px;right:10px;bottom:10px;width:auto;height:46%}#screen{right:34px;bottom:50%}#decision{right:20px;bottom:48%}.title{display:none}}
</style>
</head>
